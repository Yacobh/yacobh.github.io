    <!-- Aplica el tema oscuro antes del primer paint (evita flash de tema
         claro al recargar con oscuro guardado). Espejo del toggle real en
         universo.events.theme; debe ejecutarse antes de app.js. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored ? stored === 'dark'
                             : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
