<!DOCTYPE html>
<!--
  Fallback de GitHub Pages para el router de history API (T-05, ADR-026).

  GitHub Pages sirve este archivo para toda ruta que no exista como archivo
  estático — o sea, para /plan, /cupos, /diagnostico, /admin y el resto de las
  rutas de la SPA. **No redirige y no toca la URL**: monta la misma aplicación,
  y `universo.router` decide qué sección corresponde (o muestra su propio 404).

  Diferencias deliberadas con index.html, que es el documento canónico de "/":
  - rutas **absolutas** (`/public/...`) y no `./public/...`: este documento se
    sirve desde cualquier profundidad de path y las relativas se romperían;
  - `noindex`: GitHub Pages lo entrega con status HTTP 404, así que no tiene
    sentido ofrecerlo a los buscadores. La consecuencia —que las rutas públicas
    (/profesor, /privacidad, /libro-de-visitas) no sean indexables— está anotada
    en ADR-026 y en el backlog;
  - sin JSON-LD ni el <noscript> de marketing: el SEO vive en "/", que sí
    responde 200.

  El script de tema es espejo de index.html y de universo.events.theme: si se
  toca uno, se tocan los tres (L-22).
-->
<html lang="es-CL">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored ? stored === 'dark'
                             : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <title>Academia Integral</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#4f46e5">

    <link href="/public/css/app.css" rel="stylesheet" type="text/css">
    <link rel="icon" type="image/x-icon" href="/public/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/public/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/public/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/public/favicon-16x16.png">
    <link rel="manifest" href="/public/site.webmanifest">

    <link rel="preconnect" href="https://jmnqklhxcdccvdhuuiji.supabase.co" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  </head>
  <body>
    <div id="app"></div>

    <noscript>
      <h1>Academia Integral</h1>
      <p>
        Esta plataforma necesita JavaScript para funcionar. Actívalo en tu navegador,
        o vuelve a <a href="/">jacobocordova.com</a>.
      </p>
    </noscript>

    <script src="/public/js/app.js" type="text/javascript"></script>
    <script type="text/javascript">universo.core.init_BANG_();</script>
  </body>
</html>
