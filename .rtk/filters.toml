# Project-local RTK filters — commit this file with your repo.
# Filters here override user-global and built-in filters.
# Docs: https://github.com/rtk-ai/rtk#custom-filters
schema_version = 1

# clj -M:test (shadow-cljs :node-test) es muy verboso: cada :infer-warning
# imprime el bloque de código completo con contexto. La señal real son las
# líneas "Ran N tests..." / "N failures, N errors.". Esto recorta el ruido
# sin tocar esas líneas de resumen.
[filters.clj-test]
description = "Compacta la salida de clj -M:test (shadow-cljs node-test)"
match_command = "^clj\\s+-M:test"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\d+\\s*\\|",
  "^-{10,}$",
  "re-frame: Subscribe was called",
  "^\\s*https://day8\\.github\\.io",
  "^SLF4J:",
  "^\\s+[A-Za-z_]+: ",
  "^🔌 Cliente Supabase creado",
  "^\\s*\\}\\)?,?$",
]
# Sin max_lines: el resumen ("Ran N tests...", "N failures, N errors.")
# va al final de la salida cruda; un tope de líneas lo cortaría.
on_empty = "clj -M:test: sin salida"
